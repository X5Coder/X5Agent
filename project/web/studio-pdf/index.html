<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='black'/%3E%3Crect%20x='17'%20y='17'%20width='30'%20height='30'%20rx='7'%20fill='white'/%3E%3C/svg%3E" />
  <title>PDF Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Non-blocking: an offline/DNS failure falls back to system fonts
       silently and never delays or breaks the first paint. -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" crossorigin="anonymous" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" /></noscript>
  <!-- First-paint cover: paints from byte zero so opening a studio never shows
       a white sheet while the shell bundle downloads and parses. It is exactly
       the studio's own first frame — black toolbar strip, dark canvas, plain
       black design box — and the studio's pending box continues it seamlessly
       (the loading lights come in past its 250ms grace), so the real toolbar
       and composer land on an identical frame with no flash and no jump. -->
  <style>
    html,body{margin:0;padding:0;height:100%;background:#1a1a1a}
    #root{min-height:100%;background:#1a1a1a}
    .first-paint{height:100dvh;display:flex;flex-direction:column;background:#1a1a1a}
    .first-bar{height:44px;min-height:44px;background:#000}
    .first-canvas{flex:1;display:flex;align-items:center;justify-content:center;background:#1a1a1a}
    /* Same fitted page box the studio computes (width = min(availW, availH*w/h)
       with availH = viewport - 44 toolbar - 166 composer reserve). */
    .fp-box{width:clamp(119px,min(calc(100vw - 32px),calc((100dvh - 210px) * 0.707)),100%);aspect-ratio:794/1123;background:#000;border-radius:10px;box-shadow:0 12px 48px rgba(0,0,0,.45)}
    @media (max-width:640px){.fp-box{width:clamp(119px,min(calc(100vw - 20px),calc((100dvh - 210px) * 0.707)),100%)}}
    /* A cover that never becomes the app must not stay silent: a blocked or
       failed bundle would look exactly like a design that simply never loads.
       The note lives INSIDE #root, so a normal mount removes it with the cover. */
    .boot-note{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:#8b8b8b;
      font:500 12px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:none}
    .boot-note.on{display:block}
    .boot-note button{background:none;border:0;padding:0 2px;color:#fff;font:inherit;font-weight:700;
      cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  </style>
</head>
<body>
  <div id="root">
    <div class="first-paint" aria-hidden="true"><div class="first-bar"></div><div class="first-canvas"><div class="fp-box"></div></div></div>
    <div class="boot-note" id="x5-boot-note" role="status">Still loading the studio… <button type="button" id="x5-boot-retry">Reload</button></div>
  </div>
  <script>
    /* The cover only exists until the studio app mounts (React renders into
       #root and replaces it and this note). If the bundle never arrives —
       blocked, offline, or a JS error — the black box would otherwise wait
       forever with no explanation, so past the grace it says so and offers a
       way out instead of hiding the failure. */
    (function () {
      var note = document.getElementById('x5-boot-note');
      var retry = document.getElementById('x5-boot-retry');
      if (retry) retry.addEventListener('click', function () { window.location.reload(); });
      window.setTimeout(function () {
        if (note && document.body.contains(note)) note.className = 'boot-note on';
      }, 8000);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
