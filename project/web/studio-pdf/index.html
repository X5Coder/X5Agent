<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='black'/%3E%3Crect%20x='17'%20y='17'%20width='30'%20height='30'%20rx='7'%20fill='white'/%3E%3C/svg%3E" />
  <title>PDF Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Non-blocking: an offline/DNS failure falls back to system fonts
       silently and never delays or breaks the first paint. -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" crossorigin="anonymous" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" /></noscript>
  <!-- First-paint cover (inline so it paints before the 2.8MB bundle even
       parses): the dark studio look from byte zero, never a white sheet, and
       no featureless frame either — the page area already shows the black
       design box with the loading lights, exactly like the studio's own
       pending box, so the real toolbar lands on an identical frame (no jump
       and no blank template) whatever the bundle does. React replaces this
       static placeholder on boot. -->
  <style>
    html,body{margin:0;padding:0;height:100%;background:#1a1a1a}
    #root{min-height:100%;background:#1a1a1a}
    .first-paint{height:100dvh;display:flex;flex-direction:column;background:#1a1a1a}
    .first-bar{height:44px;min-height:44px;background:#000}
    .first-canvas{flex:1;display:flex;align-items:center;justify-content:center;background:#1a1a1a}
    /* Same fitted page box the studio computes (width = min(availW, availH*w/h)
       with availH = viewport - 44 toolbar - 166 composer reserve). */
    .fp-box{width:clamp(119px,min(calc(100vw - 32px),calc((100dvh - 210px) * 0.707)),100%);aspect-ratio:794/1123;background:#000;border-radius:10px;box-shadow:0 12px 48px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    .fp-dots{display:grid;grid-template-columns:repeat(5,14px);gap:8px}
    .fp-dots span{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18);animation:fp-ring 1.6s infinite}
    .fp-dots span[data-ring="1"]{animation-delay:.3s}
    .fp-dots span[data-ring="2"]{animation-delay:.6s}
    .fp-word{font-size:15px;font-weight:600;letter-spacing:.04em;color:#eee;font-family:'Space Grotesk',system-ui,sans-serif}
    @keyframes fp-ring{0%,100%{opacity:.2}50%{opacity:1}}
    @media (max-width:640px){.fp-box{width:clamp(119px,min(calc(100vw - 20px),calc((100dvh - 210px) * 0.707)),100%)}}
    @media (prefers-reduced-motion: reduce){.fp-dots span{animation:none}}
  </style>
</head>
<body>
  <div id="root"><div class="first-paint" aria-hidden="true"><div class="first-bar"></div><div class="first-canvas"><div class="fp-box"><div class="fp-dots"><span data-ring="2"></span><span data-ring="2"></span><span data-ring="2"></span><span data-ring="2"></span><span data-ring="2"></span><span data-ring="2"></span><span data-ring="1"></span><span data-ring="1"></span><span data-ring="1"></span><span data-ring="2"></span><span data-ring="2"></span><span data-ring="1"></span><span data-ring="0"></span><span data-ring="1"></span><span data-ring="2"></span><span data-ring="2"></span><span data-ring="1"></span><span data-ring="1"></span><span data-ring="1"></span><span data-ring="2"></span><span data-ring="2"></span><span data-ring="2"></span><span data-ring="2"></span><span data-ring="2"></span><span data-ring="2"></span></div><div class="fp-word">Loading…</div></div></div></div></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
