<!DOCTYPE html>
<!-- X5Agent console gate: first run creates the owner, then it is sign-in only.
     First run (no owner record) = "Create your account" (POST /api/auth/setup,
     create-once); afterwards = sign-in (POST /api/auth/login, cookie session).
     Self-contained (inline css/js/SVG, no extra files) so the auth gate needs
     no exemptions — only /login.html is public. English, full-screen, no card
     template: LEFT shows the agent console itself (same look as the app),
     RIGHT has email+password + Connect button on the site background.
     Same favicon + mark as the dashboard (black ground, white square).
     Dashboard glass on the fields. Mobile: image hidden, form full width. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='black'/%3E%3Crect%20x='17'%20y='17'%20width='30'%20height='30'%20rx='7'%20fill='white'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='black'/%3E%3Crect%20x='17'%20y='17'%20width='30'%20height='30'%20rx='7'%20fill='white'/%3E%3C/svg%3E" />
<title>X5Agent — Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --background-gray-main: #1a1a1a;
    --background-menu-white: #212121;
    --background-nav: #121212;
    --border-main: rgba(255, 255, 255, 0.09);
    --text-primary: #ededed;
    --text-secondary: #a3a3a3;
    --text-tertiary: #737373;
    --blue: #3b9eff;
    --blue-hi: #6db6ff;
    --blue-lo: #1f7fe0;
    --red: #f04438;
    --green: #34c77b;
    --glass-bg: linear-gradient(165deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03) 42%, rgba(255,255,255,0.055) 100%);
    --glass-border: rgba(255, 255, 255, 0.14);
    --glass-blur: blur(22px) saturate(1.55);
    --glass-hi: inset 0 1px 0 rgba(255, 255, 255, 0.22);
    --glass-lo: inset 0 -1px 0 rgba(0, 0, 0, 0.22);
    --glass-sh: 0 8px 28px rgba(0, 0, 0, 0.35), 0 1px 0 rgba(0, 0, 0, 0.2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; min-height: 100vh; color: var(--text-primary);
    font-family: "Inter", system-ui, "Segoe UI", sans-serif;
    background: var(--background-gray-main);
  }
  /* ---- LEFT: the agent console look — smaller, melting into the form side ---- */
  .visual { flex: 0 1 42%; position: relative; overflow: hidden; min-height: 100vh; background: #000; }
  .visual svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .visual::after {
    content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 210px;
    background: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.55) 55%, var(--background-gray-main) 100%);
    pointer-events: none;
  }
  .visual::before {
    content: ""; position: absolute; top: 7%; bottom: 7%; right: 0; width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,.30) 30%, rgba(255,255,255,.30) 70%, transparent);
    box-shadow: 0 0 12px rgba(255,255,255,.12);
    pointer-events: none;
  }
  /* ---- RIGHT: form straight on background, no card ---- */
  .pane {
    flex: 1 1 58%; display: flex; align-items: center; justify-content: center;
    padding: 40px 48px; position: relative;
    background:
      radial-gradient(700px 420px at 90% 0%, rgba(59,158,255,.12) 0%, transparent 60%),
      var(--background-gray-main);
  }
  .form-wrap { width: min(100%, 400px); animation: riseIn .4s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .brand-mark {
    width: 42px; height: 42px; border-radius: 11px; background: #000;
    border: 1px solid rgba(255,255,255,.14);
    display: flex; align-items: center; justify-content: center; flex: none;
    animation: markIn .55s cubic-bezier(.22,.61,.36,1) both;
  }
  @keyframes markIn {
    from { opacity: 0; transform: scale(.6); }
    to { opacity: 1; transform: scale(1); }
  }
  .brand-mark svg { width: 22px; height: 22px; }
  .visual svg .pop {
    transform-box: fill-box; transform-origin: center;
    animation: popIn .8s cubic-bezier(.22,.61,.36,1) .1s both;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.65); }
    to { opacity: 1; transform: scale(1); }
  }
  .visual svg .rise { animation: riseIn .6s ease both; }
  .visual svg .d1 { animation-delay: .35s; }
  .visual svg .d2 { animation-delay: .5s; }
  .visual svg .d3 { animation-delay: .65s; }
  .brand .t { font-family: "Space Grotesk", "Inter", sans-serif; font-weight: 700; font-size: 20px; }
  .brand .t .nx { color: var(--blue); }
  h1 { font-family: "Space Grotesk", "Inter", sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -.5px; }
  h1 .wave {
    display: inline-block; font-size: .92em;
    transform-origin: 70% 70%;
    filter: drop-shadow(0 0 10px rgba(59,158,255,.45));
    animation: wave 2.4s ease-in-out infinite;
  }
  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(16deg); }
    40% { transform: rotate(-8deg); }
    60% { transform: rotate(14deg); }
    80% { transform: rotate(-4deg); }
  }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 22px 0 8px; }
  /* first-run note (rules shown once, before the fields) */
  .hint {
    font-size: 12.5px; line-height: 1.5; color: var(--text-tertiary);
    margin-top: 10px; max-width: 340px;
  }
  .hint[hidden] { display: none; }
  /* Dashboard white-glass credential fields (same as the app templates):
     white gradient + blur + bright top edge. Focus only brightens the
     border like glass catching light — never a blue ring. */
  .field {
    display: flex; align-items: center; gap: 12px;
    height: 52px; padding: 0 10px 0 16px; border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.28),
                inset 0 -1px 0 rgba(0,0,0,0.15),
                0 4px 14px rgba(0,0,0,0.22);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .field:hover { border-color: rgba(255, 255, 255, 0.24); }
  .field:focus-within {
    border-color: rgba(255, 255, 255, 0.32);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.32),
                inset 0 -1px 0 rgba(0,0,0,0.15),
                0 4px 16px rgba(0,0,0,0.25),
                0 0 0 3px rgba(255,255,255,0.05);
  }
  .field.bad { border-color: rgba(240,68,56,.6); }
  .field.ok { border-color: rgba(52,199,123,.5); }
  .field .ico { width: 20px; height: 20px; flex: none; color: var(--text-tertiary); }
  .field:focus-within .ico { color: #fff; }
  .field input {
    flex: 1; min-width: 0; border: 0; background: transparent;
    padding: 12px 4px; color: var(--text-primary);
    font-size: 16px; font-family: inherit; outline: none;
  }
  .field input::placeholder { color: var(--text-tertiary); }
  .toggle {
    flex: none; border: 0; background: transparent;
    color: var(--text-tertiary); border-radius: 8px;
    padding: 8px; cursor: pointer; line-height: 0;
  }
  .toggle:hover { color: #fff; }
  .toggle svg { width: 20px; height: 20px; display: block; }
  #err {
    display: none; margin-top: 16px; padding: 12px 14px; border-radius: 11px;
    font-size: 13.5px; line-height: 1.7; color: #fda4af;
    background: rgba(240,68,56,.10); border: 1px solid rgba(240,68,56,.4);
  }
  #err.show { display: block; animation: errIn .38s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes errIn {
    0% { opacity: 0; transform: translateY(-8px) scale(.98); }
    55% { opacity: 1; transform: translateY(2px) scale(1); }
    75% { transform: translateX(4px); }
    100% { opacity: 1; transform: none; }
  }
  /* Dashboard glass action button (same glass as the app templates). */
  button.go {
    position: relative; width: 100%; height: 50px; margin-top: 28px; padding: 0 18px;
    overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--glass-bg), var(--background-menu-white);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border); border-radius: 999px;
    color: #fff; font-size: 15px; font-weight: 600; font-family: inherit; letter-spacing: .04em;
    text-shadow: 0 1px 2px rgba(0,0,0,.4); cursor: pointer; white-space: nowrap;
    box-shadow: var(--glass-hi), var(--glass-lo), var(--glass-sh);
    transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  button.go::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35) 30%, rgba(255,255,255,.35) 70%, transparent);
    pointer-events: none;
  }
  button.go:hover:not(:disabled) { border-color: rgba(255,255,255,.22); }
  button.go:active:not(:disabled) { transform: scale(.98); }
  button.go:disabled { opacity: .8; cursor: default; }
  .spinner {
    display: none; width: 19px; height: 19px; border-radius: 50%; flex: none;
    border: 3px solid rgba(255,255,255,.35); border-top-color: #fff;
    animation: spin .8s linear infinite;
  }
  button.go.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 860px) {
    body { flex-direction: column; }
    .visual { display: none; }
    .pane { flex: 1; width: 100%; padding: 40px 24px; align-items: center; }
    .form-wrap { width: min(100%, 420px); margin: 0 auto; }
    h1 { font-size: 28px; }
  }
</style>
</head>
<body>
  <div class="visual" aria-hidden="true">
    <svg viewBox="0 0 620 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="vglow" cx="50%" cy="42%" r="55%">
          <stop offset="0%" stop-color="#3b9eff" stop-opacity="0.10"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <pattern id="vgrid" width="52" height="52" patternUnits="userSpaceOnUse">
          <path d="M52 0H0V52" fill="none" stroke="#ffffff" stroke-opacity="0.028"/>
        </pattern>
        <filter id="sqGlow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="13" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <rect width="620" height="900" fill="#000000"/>
      <rect width="620" height="900" fill="url(#vgrid)"/>
      <rect width="620" height="900" fill="url(#vglow)"/>
      <!-- site icon: black ground, white glowing square with dark core (dashboard mark) -->
      <circle cx="310" cy="390" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
      <circle cx="310" cy="390" r="128" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
      <g class="pop">
        <rect x="228" y="308" width="164" height="164" rx="38" fill="#0d0d0d" stroke="#ffffff" stroke-opacity="0.16"/>
        <rect x="272" y="352" width="76" height="76" rx="18" fill="#ffffff" filter="url(#sqGlow)"/>
      </g>
      <text class="rise d1" x="310" y="565" text-anchor="middle" fill="#ededed" font-size="38" font-weight="700" letter-spacing="-1" font-family="Space Grotesk, sans-serif">X5Agent</text>
      <text class="rise d2" x="310" y="598" text-anchor="middle" fill="#ededed" font-size="17" font-weight="600" letter-spacing="0.5" font-family="Inter, sans-serif">Your Personal AI Assistant</text>
      <text class="rise d3" x="310" y="624" text-anchor="middle" fill="#a3a3a3" font-size="13" font-family="Inter, sans-serif">Your all-in-one AI agent to browse, research,</text>
      <text class="rise d3" x="310" y="644" text-anchor="middle" fill="#a3a3a3" font-size="13" font-family="Inter, sans-serif">summarize videos, create content,</text>
      <text class="rise d3" x="310" y="664" text-anchor="middle" fill="#a3a3a3" font-size="13" font-family="Inter, sans-serif">control your computer, and automate tasks</text>
    </svg>
  </div>
  <section class="pane">
    <div class="form-wrap">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><filter id="mkGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.6" result="b"><animate attributeName="stdDeviation" values="1.2;2.8;1.2" dur="2.2s" repeatCount="indefinite"/></feGaussianBlur><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="6" y="6" width="20" height="20" rx="5" fill="#fff" filter="url(#mkGlow)"/></svg>
        </div>
        <div class="t"><span class="nx">X5</span>Agent</div>
      </div>
      <h1 id="title">Hi, sir! <span class="wave">👋</span></h1>
      <p class="hint" id="hint" hidden></p>
      <form id="form" novalidate>        <label for="email">Email</label>
        <div class="field" id="emailField">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          <input id="email" type="email" autocomplete="off" spellcheck="false" autocapitalize="off" required placeholder="you@gmail.com">
        </div>
        <label for="pw">Password</label>
        <div class="field" id="pwField">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="pw" type="password" autocomplete="new-password" required placeholder="••••••••">
          <button type="button" class="toggle" id="showPw" aria-label="Show password">
            <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeShut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.16 3.19"/><path d="M6.61 6.61A17.5 17.5 0 0 0 2 12s3.5 7 10 7a10.7 10.7 0 0 0 4.39-.92"/><path d="m2 2 20 20"/></svg>
          </button>
        </div>
        <div id="pw2Wrap" hidden>
          <label for="pw2">Confirm password</label>
          <div class="field" id="pw2Field">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="pw2" type="password" autocomplete="new-password" placeholder="••••••••">
          </div>
        </div>
        <div id="err"></div>
        <button class="go" id="go" type="submit"><span class="spinner"></span><span id="goText">Connect</span></button>
      </form>
    </div>
  </section>
<script>
(function () {
  var err = document.getElementById("err");
  var email = document.getElementById("email");
  var pw = document.getElementById("pw");
  var emailField = document.getElementById("emailField");
  var pwField = document.getElementById("pwField");
  var go = document.getElementById("go");
  var goText = document.getElementById("goText");
  var title = document.getElementById("title");
  var hint = document.getElementById("hint");
  var pw2Wrap = document.getElementById("pw2Wrap");
  var pw2 = document.getElementById("pw2");
  var pw2Field = document.getElementById("pw2Field");
  // "setup" = first run (no owner yet) -> create it once; "login" = normal.
  var mode = "login";
  function toSetup() {
    mode = "setup";
    title.textContent = "Create your account";
    goText.textContent = "Create account";
    hint.textContent = "First run only: this account owns this console. " +
      "Use a Gmail address and an English password of at least 8 characters.";
    hint.hidden = false;
    pw2Wrap.hidden = false;
  }
  function fail(msg) { err.textContent = msg; err.classList.add("show"); }
  function clearFail() { err.textContent = ""; err.classList.remove("show"); }
  function setLoading(on) {
    go.disabled = on;
    go.classList.toggle("loading", on);
  }
  document.getElementById("showPw").addEventListener("click", function () {
    var show = pw.type === "password";
    pw.type = show ? "text" : "password";
    document.getElementById("eyeOpen").style.display = show ? "none" : "block";
    document.getElementById("eyeShut").style.display = show ? "block" : "none";
    this.setAttribute("aria-label", show ? "Hide password" : "Show password");
    pw.focus();
  });
  email.addEventListener("input", function () {
    var v = email.value.trim();
    if (!v) { emailField.className = "field"; return; }
    emailField.className = "field " + (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) ? "ok" : "bad");
  });
  pw.addEventListener("input", function () {
    var n = pw.value.length;
    if (!n) { pwField.className = "field"; return; }
    pwField.className = "field " + (n >= 8 ? "ok" : "bad");
  });
  pw2.addEventListener("input", function () {
    if (!pw2.value.length) { pw2Field.className = "field"; return; }
    pw2Field.className = "field " + (pw2.value === pw.value ? "ok" : "bad");
  });
  fetch("/api/auth/status", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
    // No owner record yet = the very first run: offer creation once.
    if (d && d.owner_missing) { toSetup(); return; }
    title.innerHTML = "Hi, sir! <span class=\"wave\">👋</span>";
    goText.textContent = "Connect";
  }).catch(function () { fail("Could not reach the server"); });
  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    clearFail();
    var em = email.value.trim();
    var p1 = pw.value;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { fail("Enter a valid email address"); email.focus(); return; }
    if (mode === "setup" && !/^[^@\s]+@gmail\.com$/i.test(em)) {
      fail("Use a Gmail address (name@gmail.com)"); email.focus(); return;
    }
    if (p1.length < 8) { fail("Password too short (8 characters minimum)"); pw.focus(); return; }
    if (mode === "setup" && !/^[\x20-\x7e]+$/.test(p1)) {
      fail("Use English letters, digits and symbols only"); pw.focus(); return;
    }
    if (mode === "setup" && p1 !== pw2.value) {
      fail("Passwords do not match"); pw2.focus(); return;
    }
    setLoading(true);
    fetch(mode === "setup" ? "/api/auth/setup" : "/api/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: em, password: p1 })
    }).then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); }).then(function (x) {
      if (x.s === 200 && x.d && x.d.ok) {
        // One-way login: replace history so Back never returns here.
        // Session = HttpOnly cookie only (set by the server), no tokens.
        // First run continues on the plan page (the server sends `next`).
        goText.textContent = mode === "setup" ? "Created ✓" : "Connected ✓";
        var next = (mode === "setup" && x.d.next) ? x.d.next : "/";
        try { location.replace(next); } catch (_) { location.href = next; }
        return; }
      if (x.s === 409 && mode === "setup") {
        // Someone (another tab/device) already created it: switch to sign-in.
        mode = "login";
        title.innerHTML = "Hi, sir! <span class=\"wave\">👋</span>";
        goText.textContent = "Connect";
        hint.hidden = true;
        pw2Wrap.hidden = true;
        fail("This console already has an owner — sign in instead.");
        setLoading(false);
        return;
      }
      fail((x.d && x.d.error) || "Connection failed");
      setLoading(false);
    }).catch(function () { fail("Could not reach the server"); setLoading(false); });
  });
})();
</script>
</body>
</html>
