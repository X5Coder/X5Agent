[project]
name = "x5agent"
version = "0.26.1"
description = "Professional Agent Loop with built-in embedding model and universal AI model connections (AI Models templates)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "X5Agent" }]
dependencies = [
    "huggingface_hub>=0.25",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "onnxruntime>=1.18",
    "safetensors>=0.4",
    "numpy>=1.24",
    "pillow>=10.0",
    "x5browser==1.6.2",
    "markitdown>=0.1.0",
    "mammoth>=1.11",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pandas>=2.0",
    "pdfplumber>=0.11",
    "fpdf2>=2.7",
    "pypdf>=3.1",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.5",
    "python-pptx>=1.0",
    "yt-dlp>=2024.8.6",
    "curl-cffi>=0.5",  # yt-dlp impersonation (required for TikTok)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "scripts*"]

[project.scripts]
x5agent = "scripts.cli:main"
x5agent-off = "scripts.cli:off"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
