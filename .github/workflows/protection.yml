name: Protection

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install signature dependency
        run: python -m pip install "cryptography>=42"
      - name: Verify signed policy and manifest
        run: python project/scripts/agent_build.py --check-only
      - name: Verify protected-code notices
        run: python project/scripts/agent_notice.py --verify
