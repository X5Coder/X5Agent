name: Build release

# Compiles the source-hidden release trees for every supported platform.
# Cross-compilation is impossible (a .so/.pyd is tied to one OS + Python ABI),
# so each target is built on its own runner. The asset name always says which
# interpreter it needs, because the compiled modules only load on that ABI:
#   windows-x64              Python 3.12   (installer built from this one)
#   linux-x64-ubuntu22.04    Python 3.10
#   linux-x64-ubuntu24.04    Python 3.12
#   linux-x64-ubuntu24.04-headless  Python 3.12 (no web console)
#   macos-arm64              Python 3.12
#   macos-x64                Python 3.12
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tag: windows-x64
            python: "3.12"
            flavor: full
          - os: ubuntu-22.04
            tag: linux-x64-ubuntu22.04
            python: "3.10"
            flavor: full
          - os: ubuntu-24.04
            tag: linux-x64-ubuntu24.04
            python: "3.12"
            flavor: full
          - os: ubuntu-24.04
            tag: linux-x64-ubuntu24.04-headless
            python: "3.12"
            flavor: headless
          - os: macos-14
            tag: macos-arm64
            python: "3.12"
            flavor: full
          - os: macos-13
            tag: macos-x64
            python: "3.12"
            flavor: full

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython>=3.0" "setuptools>=68" wheel tomli

      - name: Build
        run: python project/scripts/build_release.py --out dist --flavor ${{ matrix.flavor }}

      - name: Name the archive for this target
        shell: bash
        run: |
          set -e
          for f in dist/*.zip; do
            mv "$f" "dist/x5agent-${{ matrix.tag }}.zip"
          done

      - name: Verify no Python source shipped
        shell: bash
        run: |
          set -e
          count=$(python - <<'PY'
          import glob, zipfile
          total = 0
          for path in glob.glob("dist/*.zip"):
              with zipfile.ZipFile(path) as z:
                  total += sum(1 for n in z.namelist() if n.endswith(".py"))
          print(total)
          PY
          )
          echo "python files in archives: $count"
          test "$count" = "0"

      - uses: actions/upload-artifact@v4
        with:
          name: x5agent-${{ matrix.tag }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  windows-installer:
    name: windows-installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: x5agent-windows-x64
          path: dist

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist -Filter *.zip | Select-Object -First 1).FullName
          ./installer/build-installer.ps1 -ReleaseZip $zip -Iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: x5agent-windows-installer
          path: installer/out/*.exe
          if-no-files-found: error
          retention-days: 30
